name: yimaflutter
description: "月事记 - 经期记录，本地存储，隐私安全"
publish_to: 'none'
version: 1.37.0+116

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^4.0.0
  intl: ^0.20.2
  file_picker: ^12.2.0
  share_plus: ^13.3.0
  path_provider: ^2.1.1
  http: ^1.2.0
  flutter_markdown_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  # 内置统一中文字体 MiSans（GB2312 常用字子集，4 字重共 ~6.6MB）。
  # 消除不同 ROM 默认字体（MiSans/HarmonyOS Sans/OPPO Sans）度量差异
  # 导致的跨机型排版不一致。子集外的生僻字回退系统字体。
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F3E7E3"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
