name: yimaflutter
description: "月事记 - 经期记录，本地存储，隐私安全"
publish_to: 'none'
version: 1.13.4+56

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_timezone: ^4.0.0
  intl: ^0.20.2
  file_picker: 10.0.0
  share_plus: ^7.2.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F3E7E3"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
